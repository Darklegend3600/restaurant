<div class="container d-flex align-items-center py-4">  <main class="form-signin w-100 m-auto"><form [formGroup]="registerForm">

  <div class="form-floating">

    <input type="email" class="form-control" placeholder="Email" formControlName="email" />

    <label>Email address</label>

  </div>

  <div class="form-floating">

    <input type="password" class="form-control" placeholder="Password" formControlName="password" />

    <label>Password</label>

  </div>

  <div class="form-floating">

    <input type="text" class="form-control" placeholder="First Name" formControlName="firstName" />

    <label>First Name</label>

  </div>

  <div class="form-floating">

    <input type="text" class="form-control" placeholder="Last Name" formControlName="lastName" />

    <label>Last Name</label>

  </div>

  <div class="form-floating">

    <input type="number" class="form-control" placeholder="Age" formControlName="age" />

    <label>Age</label>

  </div>

  <div class="form-floating">

    <input type="text" class="form-control" placeholder="Address" formControlName="address" />

    <label>Address</label>

  </div>

  <div class="form-floating">

    <input type="text" class="form-control" placeholder="Phone" formControlName="phone" />

    <label>Phone</label>

  </div>

  <div class="form-floating">

    <input type="text" class="form-control" placeholder="Zipcode" formControlName="zipcode" />

    <label>Zipcode</label>

  </div>

  <button type="button" class="btn btn-primary w-100 py-2" routerLink="/home" (click)="register()">Sign Up</button>

</form>

  </main></div>
