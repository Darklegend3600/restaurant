<div class="container d-flex align-items-center py-4">
  <main class="form-signin w-100 m-auto">
    <form [formGroup]="registerForm">
      <h1 class="h3 mb-3 fw-normal">Please sign up</h1>
      <div class="form-floating">
        <input
          type="email"
          class="form-control"
          id="floatingInput"
          placeholder="name@example.com"
          formControlName="email"
        />
        <label for="floatingInput">Email address</label>
      </div>
      <div class="form-floating">
        <input formControlName="password" type="password" class="form-control" id="floatingPassword" placeholder="Password" />
        <label for="floatingPassword">Password</label>
      </div>
      <div class="form-floating">
        <input formControlName="firstName" type="text" class="form-control" id="floatingPassword" placeholder="First Name" />
        <label for="floatingPassword">First Name</label>
      </div>
      <div class="form-floating">
        <input formControlName="lastName" type="text" class="form-control" id="floatingPassword" placeholder="Last Name" />
        <label for="floatingPassword">Last Name</label>
      </div>
      <div class="form-floating">
        <input formControlName="age" type="number" class="form-control" id="floatingPassword" placeholder="Age" />
        <label for="floatingPassword">Age</label>
      </div>
      <div class="form-floating">
        <input formControlName="address" type="text" class="form-control" id="floatingPassword" placeholder="Address" />
        <label for="floatingPassword">Address</label>
      </div>
      <div class="form-floating">
        <input formControlName="phone" type="text" class="form-control" id="floatingPassword" placeholder="Phone" />
        <label for="floatingPassword">Phone</label>
      </div>
      <div class="form-floating">
        <input formControlName="zipcode" type="password" class="form-control" id="floatingPassword" placeholder="Password" />
        <label for="floatingPassword">Zipcode</label>
      </div>
      <div class="form-floating">
        <input formControlName="gender" type="text" class="form-control" id="floatingPassword" placeholder="Gender" />
        <label for="floatingPassword">Gender</label>
      </div>
      <div class="form-floating">
        <input formControlName="avatar" type="text" class="form-control" id="floatingPassword" placeholder="Avatar" />
        <label for="floatingPassword">Avatar</label>
      </div>
      <div class="form-check text-start my-3">
        <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault" />
        <label class="form-check-label" for="checkDefault"> Remember me </label>
      </div>
      <button
      class="btn btn-primary w-100 py-2"
      type="submit"
      (click)="register()"
      >Sign Up</button>
      <p class="mt-5 mb-3 text-body-secondary">© 2017–2025</p>
    </form>
  </main>
</div>
